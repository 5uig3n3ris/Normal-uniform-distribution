<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>شبیه‌سازی بازده ماهانه</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h3>شبیه‌سازی بازده ماهانه با توزیع نرمال</h3>
  <p>میانگین بازده ماهانه: 1.2% | انحراف معیار: 4%</p>
  <canvas id="returnsChart" width="800" height="400"></canvas>

  <script>
    function generateNormalReturns(mean = 0.012, stdDev = 0.04, count = 30) {
      const returns = [];
      for (let i = 0; i < count; i++) {
        // Box-Muller transform
        let u = Math.random();
        let v = Math.random();
        let z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        returns.push((mean + stdDev * z) * 100); // Convert to percentage
      }
      return returns;
    }

    const returns = generateNormalReturns();
    const labels = Array.from({length: returns.length}, (_, i) => `روز ${i + 1}`);

    new Chart(document.getElementById('returnsChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'بازده روزانه (%)',
          data: returns,
          backgroundColor: returns.map(r => r >= 0 ? 'green' : 'red')
        }]
      },
      options: {
        scales: {
          y: { title: { display: true, text: 'درصد بازده' } }
        },
        plugins: {
          title: {
            display: true,
            text: 'شبیه‌سازی بازده سرمایه‌گذاری (توزیع نرمال)'
          }
        }
      }
    });
  </script>
</body>
</html>
