<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>شبیه‌سازی قیمت با توزیع لگ-نرمال</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h3>شبیه‌سازی قیمت دارایی با توزیع لگ-نرمال</h3>
  <p>قیمت اولیه: 100 واحد</p>
  <canvas id="lognormalChart" width="800" height="400"></canvas>

  <script>
    function generateLogNormalPrices(S0 = 100, mean = 0.001, stdDev = 0.03, steps = 30) {
      const prices = [S0];
      for (let i = 1; i < steps; i++) {
        let u = Math.random();
        let v = Math.random();
        let z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        let returnRate = Math.exp(mean + stdDev * z); // log-normal step
        let newPrice = prices[i - 1] * returnRate;
        prices.push(newPrice);
      }
      return prices;
    }

    const prices = generateLogNormalPrices();
    const labels = Array.from({length: prices.length}, (_, i) => `روز ${i + 1}`);

    new Chart(document.getElementById('lognormalChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'قیمت شبیه‌سازی شده',
          data: prices,
          borderColor: 'blue',
          fill: false,
        }]
      },
      options: {
        scales: {
          y: { title: { display: true, text: 'قیمت (واحد پول)' } }
        },
        plugins: {
          title: {
            display: true,
            text: 'مدل‌سازی قیمت با توزیع لگ-نرمال'
          }
        }
      }
    });
  </script>
</body>
</html>
